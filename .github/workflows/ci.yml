name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: nbb tests + self-audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      # nbb が第一経路（CLAUDE.md ランタイム優先順位）。JVM 経路は互換として
      # clojure -M:test でも回せるが、CI は nbb を正とする。
      # npx はスラッシュ入りスクリプトパス（test/run.cljs）をパッケージ名と
      # 誤解するため、グローバル install してから nbb を直接呼ぶ。
      - name: Install nbb
        run: npm install -g nbb
      - name: Unit tests (nbb)
        run: nbb --classpath src:test test/run.cljs
      - name: Cross-episode self-audit (nbb)
        run: nbb --classpath src tools/audit.cljs
