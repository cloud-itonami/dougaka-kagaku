name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: nbb tests + self-audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      # nbb が第一経路（AGENTS.md ランタイム優先順位）。JVM 経路は互換として
      # clojure -M:test でも回せるが、CI は nbb を正とする。
      # npx はスラッシュ入りスクリプトパス（test/run.cljk）をパッケージ名と
      # 誤解するため、グローバル install してから nbb を直接呼ぶ。
      - name: Install nbb
        run: npm install -g nbb
      - name: Unit tests (nbb)
        run: nbb --classpath src:test test/run.cljk
      - name: Cross-episode self-audit (nbb)
        run: nbb --classpath src tools/audit.cljk
      - name: Verify closed Kotoba project with released native CLI
        shell: bash
        run: |
          set -euo pipefail
          release_dir="$RUNNER_TEMP/kotoba-v0.6.21"
          cli_dir="$RUNNER_TEMP/kotoba-cli"
          mkdir -p "$release_dir" "$cli_dir"
          curl -L --fail --silent --show-error \
            -o "$release_dir/kotoba-linux-amd64.tar.gz" \
            https://github.com/kotoba-lang/kotoba/releases/download/v0.6.21/kotoba-linux-amd64.tar.gz
          curl -L --fail --silent --show-error \
            -o "$release_dir/kotoba-linux-amd64.tar.gz.sha256" \
            https://github.com/kotoba-lang/kotoba/releases/download/v0.6.21/kotoba-linux-amd64.tar.gz.sha256
          (cd "$release_dir" && sha256sum -c kotoba-linux-amd64.tar.gz.sha256)
          tar -xzf "$release_dir/kotoba-linux-amd64.tar.gz" -C "$cli_dir"
          "$cli_dir/kotoba" check --project kotoba-project.edn --target web --json
          "$cli_dir/kotoba" compile --project kotoba-project.edn --target web \
            --output "$RUNNER_TEMP/kagaku-time-units.mjs" --json
          node scripts/test-kotoba-project.mjs "$RUNNER_TEMP/kagaku-time-units.mjs"
